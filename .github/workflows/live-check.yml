name: Comprobar aplicación publicada
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Comprobar distribución de Centro I.A.]
    types: [completed]
permissions:
  contents: read
jobs:
  public-health:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comparar recursos y rutas fuera del sitio
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/verify-live.mjs https://ssavin05.github.io/Centro-I.A/ public-health.json; then exit 0; fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          exit 1
      - name: Conservar resultado sin datos privados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: centro-public-health
          path: public-health.json
          retention-days: 7
