name: Comprobar distribución de Centro I.A.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: centro-distribucion
  cancel-in-progress: true
jobs:
  verify-distribution:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Instalar dependencias de prueba sin scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Revisar proyecto y filtro de publicación
        run: node scripts/verify.mjs
      - name: Conservar distribución del manifiesto
        uses: actions/upload-artifact@v4
        with:
          name: centro-distribucion
          path: dist
          include-hidden-files: true
          retention-days: 7
